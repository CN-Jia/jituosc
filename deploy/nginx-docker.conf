# 极拓空间 Nginx Docker 配置 — 容器内使用
# 用户端 / + 管理端 /admin/ + API 反向代理到 backend 容器

upstream jituo_api {
    server backend:3000;
    keepalive 32;
}

# ── HTTP → HTTPS 重定向 ──────────────────────────────────────
server {
    listen 80;
    server_name jituo.online www.jituo.online;

    # Certbot 验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS 主服务 ─────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name jituo.online www.jituo.online;

    ssl_certificate     /etc/letsencrypt/live/jituo.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jituo.online/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 健康检查
    location = /health {
        proxy_pass http://jituo_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 用户端静态文件
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # 指标端点：只允许内网抓取。
    # Prometheus 与后端同机（见 deploy/monitoring），直接抓 127.0.0.1:3000，不经过 Nginx；
    # 这里显式对公网返回 404，避免将来有人顺手把 / 全量反代时把指标暴露出去。
    location = /metrics {
        return 404;
    }

    # 上传文件（截图等）——反代到 backend 的 /uploads/ 静态服务
    #
    # 必须用 ^~ 修饰符：下面的正则 location `~* \.(png|jpg|...)$` 优先级高于前缀 location，
    # 若用普通的 `location /uploads/`，图片请求会被那条正则抢走，
    # 转而去 /usr/share/nginx/html 下找文件 → 上传成功但页面 404。
    location ^~ /uploads/ {
        proxy_pass http://jituo_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 静态资源长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://jituo_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # 上传体积上限：图片限 5MB（见 backend/src/shared/storage/image-upload.ts），
        # 网关留一点余量即可，不要沿用早期的 110m
        client_max_body_size 12m;
    }

    # 管理后台（子路径 /admin/）
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # Certbot 验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
