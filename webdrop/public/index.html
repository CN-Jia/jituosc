<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%81%3C/text%3E%3C/svg%3E">
<title>文件中转站</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0f172a; --card:#1e293b; --card2:#243349; --line:#334155;
    --fg:#e2e8f0; --dim:#94a3b8; --accent:#38bdf8; --ok:#34d399; --bad:#f87171; --warn:#fbbf24;
  }
  html,body{margin:0;padding:0;height:100%}
  body{
    background:radial-gradient(1200px 600px at 50% -10%,#1e3a5f 0%,var(--bg) 55%) no-repeat,var(--bg);
    color:var(--fg);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    min-height:100%;padding:20px 16px 60px;
  }
  .wrap{max-width:860px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  h1{font-size:20px;margin:0;font-weight:600;letter-spacing:.5px}
  h1 span{color:var(--accent)}
  .meta{color:var(--dim);font-size:12.5px}
  .btn{
    border:1px solid var(--line);background:var(--card);color:var(--fg);
    padding:8px 14px;border-radius:9px;cursor:pointer;font-size:13.5px;transition:.15s;
  }
  .btn:hover{background:var(--card2);border-color:var(--accent)}
  .btn.primary{background:var(--accent);color:#06263a;border-color:var(--accent);font-weight:600}
  .btn.primary:hover{filter:brightness(1.1)}
  .btn.ghost{background:transparent}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  #login{max-width:360px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 24px;text-align:center}
  #login h2{margin:0 0 6px;font-size:18px;font-weight:600}
  #login p{margin:0 0 20px;color:var(--dim);font-size:13px}
  #login input{width:100%;padding:11px 13px;border-radius:9px;border:1px solid var(--line);background:#0b1220;color:var(--fg);font-size:15px;outline:none}
  #login input:focus{border-color:var(--accent)}
  #login .btn{width:100%;margin-top:14px;padding:11px}
  .err{color:var(--bad);font-size:13px;min-height:20px;margin-top:10px}

  #drop{
    border:2px dashed var(--line);border-radius:16px;padding:34px 20px;text-align:center;
    cursor:pointer;transition:.18s;background:rgba(30,41,59,.5);margin-bottom:8px;
  }
  #drop:hover,#drop.over{border-color:var(--accent);background:rgba(56,189,248,.08)}
  #drop.busy{opacity:.45;pointer-events:none}
  #drop .big{font-size:15.5px;font-weight:500}
  #drop .small{color:var(--dim);font-size:12.5px;margin-top:6px}

  #progress{margin:14px 0 4px}
  .prow{margin-bottom:11px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
  .prow .top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:7px;gap:10px}
  .prow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
  .prow .st{color:var(--dim);flex:0 0 auto;font-variant-numeric:tabular-nums}
  .bar{height:6px;background:#0b1220;border-radius:99px;overflow:hidden}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,#38bdf8,#34d399);transition:width .25s}
  .prow.done .bar > i{background:var(--ok)}
  .prow.fail .bar > i{background:var(--bad)}
  .prow .note{color:var(--warn);font-size:11.5px;margin-top:6px}
  .prow .note:empty{display:none}

  #listHead{display:flex;align-items:center;justify-content:space-between;margin:26px 0 10px;gap:10px;flex-wrap:wrap}
  #listHead .t{font-size:14px;font-weight:600}
  ul#files{list-style:none;margin:0;padding:0}
  ul#files li{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:11px;margin-bottom:8px;transition:.15s}
  ul#files li:hover{border-color:#475569;background:var(--card2)}
  .ico{flex:0 0 34px;height:34px;border-radius:8px;background:#0b1220;display:grid;place-items:center;font-size:15px}
  .info{flex:1;min-width:0}
  .fname{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fsub{color:var(--dim);font-size:12px;margin-top:1px}
  .acts{display:flex;gap:6px;flex:0 0 auto}
  .acts .btn{padding:6px 11px;font-size:12.5px}
  .empty{text-align:center;color:var(--dim);padding:40px 0;font-size:13.5px}
  .toast{
    position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:var(--card);
    border:1px solid var(--line);color:var(--fg);padding:10px 18px;border-radius:10px;font-size:13.5px;
    opacity:0;pointer-events:none;transition:.22s;z-index:99;max-width:90vw;text-align:center;
  }
  .toast.show{opacity:1;bottom:34px}
  .toast.ok{border-color:var(--ok)} .toast.bad{border-color:var(--bad)}
  @media(max-width:560px){
    .acts .btn{padding:6px 9px}
    ul#files li{padding:11px 12px;gap:10px}
  }
</style>
</head>
<body>

<div id="login">
  <h2>文件中转站</h2>
  <p>请输入访问密码</p>
  <input id="pw" type="password" placeholder="访问密码" autocomplete="current-password">
  <button class="btn primary" id="loginBtn">进入</button>
  <div class="err" id="loginErr"></div>
</div>

<div class="wrap" id="app" style="display:none">
  <header>
    <div>
      <h1>文件中转<span>站</span></h1>
      <div class="meta" id="meta"></div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn ghost" id="refreshBtn">刷新</button>
      <button class="btn ghost" id="logoutBtn">退出</button>
    </div>
  </header>

  <div id="drop">
    <div class="big">拖拽文件到这里，或点击选择</div>
    <div class="small">大文件自动分片续传 · 断线会自己重试</div>
  </div>
  <input type="file" id="picker" multiple hidden>

  <div id="progress"></div>

  <div id="listHead">
    <div class="t">文件列表 <span class="meta" id="count"></span></div>
  </div>
  <ul id="files"></ul>
  <div class="empty" id="empty" style="display:none">还没有文件</div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const BASE = location.pathname.replace(/\/+$/,'') + '/';
  const $ = (id) => document.getElementById(id);

  /* ============ 上传参数 ============ */
  const CHUNK_SIZE = 8 * 1024 * 1024;   // 每片 8MB：够大少往返，够小失败代价低
  const CONCURRENCY = 3;                // 同时传几片
  const MAX_TRIES = 6;                  // 单片最多重试次数

  let toastTimer;
  function toast(msg, kind){
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast show' + (kind ? ' ' + kind : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = 'toast'; }, 2800);
  }
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  function fmtTime(ms){
    const d = new Date(ms), n = new Date(), p = (x)=>String(x).padStart(2,'0');
    if (d.toDateString() === n.toDateString()) return '今天 ' + p(d.getHours()) + ':' + p(d.getMinutes());
    return (d.getMonth()+1) + '月' + d.getDate() + '日 ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function fmtSpeed(bps){
    if (!bps || bps < 1) return '--';
    return bps >= 1048576 ? (bps/1048576).toFixed(1)+' MB/s' : Math.round(bps/1024)+' KB/s';
  }
  function fmtEta(sec){
    if (!isFinite(sec) || sec <= 0) return '--';
    if (sec < 60) return Math.ceil(sec) + ' 秒';
    return Math.floor(sec/60) + ' 分 ' + Math.round(sec%60) + ' 秒';
  }
  function iconFor(name){
    const e = (name.split('.').pop() || '').toLowerCase();
    if (['png','jpg','jpeg','gif','webp','svg','bmp','heic'].includes(e)) return '🖼️';
    if (['mp4','mov','avi','mkv','webm','flv'].includes(e)) return '🎬';
    if (['mp3','wav','flac','aac','m4a'].includes(e)) return '🎵';
    if (['zip','rar','7z','tar','gz','bz2','xz'].includes(e)) return '🗜️';
    if (e === 'pdf') return '📕';
    if (['doc','docx'].includes(e)) return '📘';
    if (['xls','xlsx','csv'].includes(e)) return '📗';
    if (['ppt','pptx'].includes(e)) return '📙';
    if (['txt','md','log','json','js','ts','py','sh','html','css'].includes(e)) return '📄';
    return '📦';
  }
  function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function human(n){
    const u = ['B','KB','MB','GB','TB']; let i = 0;
    while (n >= 1024 && i < u.length-1){ n /= 1024; i++; }
    return (n < 10 && i > 0 ? n.toFixed(1) : Math.round(n)) + ' ' + u[i];
  }

  async function api(pathname, opts){
    const r = await fetch(BASE + pathname, Object.assign({ credentials:'same-origin' }, opts||{}));
    if (r.status === 401) { showLogin(); const e = new Error('登录已过期'); e.fatal = true; throw e; }
    let j = null;
    try { j = await r.json(); } catch(e) {}
    if (!r.ok) {
      const e = new Error((j && j.error) || ('HTTP ' + r.status));
      e.status = r.status;
      e.retry = !!(j && j.retry);
      throw e;
    }
    return j;
  }

  function showLogin(){ $('login').style.display='block'; $('app').style.display='none'; }
  function showApp(){ $('login').style.display='none'; $('app').style.display='block'; load(); }

  /* ============ 登录 ============ */
  $('loginBtn').onclick = doLogin;
  $('pw').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  async function doLogin(){
    const pw = $('pw').value;
    if (!pw) { $('loginErr').textContent = '请输入密码'; return; }
    $('loginBtn').disabled = true;
    try {
      const r = await fetch(BASE + 'login', {
        method:'POST', credentials:'same-origin',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ password: pw })
      });
      const j = await r.json().catch(()=>({}));
      if (r.ok && j.ok) { $('pw').value=''; $('loginErr').textContent=''; showApp(); }
      else { $('loginErr').textContent = (j && j.error) || '登录失败'; }
    } catch(e) {
      $('loginErr').textContent = '网络错误: ' + e.message;
    } finally {
      $('loginBtn').disabled = false;
    }
  }
  $('logoutBtn').onclick = async () => {
    try { await fetch(BASE + 'logout', { method:'POST', credentials:'same-origin' }); } catch(e){}
    showLogin();
  };
  $('refreshBtn').onclick = load;

  /* ============ 列表 ============ */
  async function load(){
    let d;
    try { d = await api('api/list'); }
    catch(e){ if (!e.fatal) toast('加载失败: ' + e.message, 'bad'); return; }

    const ul = $('files'); ul.innerHTML = '';
    $('count').textContent = d.count ? `共 ${d.count} 个 · ${d.totalText}` : '';
    $('empty').style.display = d.count ? 'none' : 'block';
    $('meta').textContent = d.disk ? `剩余空间 ${d.disk.free} / ${d.disk.total}` : '';

    for (const it of d.items){
      const li = document.createElement('li');
      li.innerHTML =
        '<div class="ico">' + iconFor(it.name) + '</div>' +
        '<div class="info"><div class="fname" title="' + esc(it.name) + '">' + esc(it.name) + '</div>' +
        '<div class="fsub">' + it.sizeText + ' · ' + fmtTime(it.mtime) + '</div></div>' +
        '<div class="acts">' +
          '<button class="btn primary dl">下载</button>' +
          '<button class="btn del">删除</button>' +
        '</div>';
      li.querySelector('.dl').onclick = () => {
        const a = document.createElement('a');
        a.href = BASE + 'api/download/' + encodeURIComponent(it.name);
        a.download = it.name;
        document.body.appendChild(a); a.click(); a.remove();
      };
      li.querySelector('.del').onclick = async () => {
        if (!confirm('确定删除「' + it.name + '」？')) return;
        try { await api('api/delete', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name: it.name }) }); toast('已删除','ok'); load(); }
        catch(e){ if (!e.fatal) toast('删除失败: ' + e.message, 'bad'); }
      };
      ul.appendChild(li);
    }
  }

  /* ============ 上传（分片 + 续传 + 校验） ============ */

  // 由 (文件名, 大小, 修改时间) 推导稳定的 uploadId —— 重选同一个文件即可续传
  function fileKey(f){
    const s = f.name + '|' + f.size + '|' + (f.lastModified || 0);
    let h1 = 0x811c9dc5, h2 = 0x01000193, h3 = 0x9e3779b9, h4 = 0x85ebca6b;
    for (let i = 0; i < s.length; i++){
      const c = s.charCodeAt(i);
      h1 = Math.imul(h1 ^ c, 16777619) >>> 0;
      h2 = Math.imul(h2 ^ (c + i), 2246822519) >>> 0;
      h3 = Math.imul(h3 ^ (c * 31 + i), 3266489917) >>> 0;
      h4 = Math.imul(h4 ^ (c + (i << 3)), 668265263) >>> 0;
    }
    const hex = (x) => (x >>> 0).toString(16).padStart(8, '0');
    return hex(h1) + hex(h2) + hex(h3) + hex(h4);
  }

  async function sha256Hex(buf){
    const d = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(d)).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  // 单片上传：裸二进制体 + 元数据走请求头，省掉 multipart 解析开销
  function putChunk(uploadId, index, blob, hash, onProgress){
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', BASE + 'api/chunk', true);
      xhr.withCredentials = true;
      xhr.setRequestHeader('Content-Type', 'application/octet-stream');
      xhr.setRequestHeader('X-Upload-Id', uploadId);
      xhr.setRequestHeader('X-Chunk-Index', String(index));
      if (hash) xhr.setRequestHeader('X-Chunk-Sha256', hash);
      xhr.upload.onprogress = (e) => { if (e.lengthComputable && onProgress) onProgress(e.loaded / e.total); };
      xhr.onload = () => {
        if (xhr.status === 401) { const e = new Error('登录已过期'); e.fatal = true; return reject(e); }
        let j = {};
        try { j = JSON.parse(xhr.responseText); } catch(e){}
        if (xhr.status === 200 && j.ok) return resolve(j);
        reject(new Error((j && j.error) || ('HTTP ' + xhr.status)));
      };
      xhr.onerror = () => reject(new Error('连接中断'));
      xhr.ontimeout = () => reject(new Error('超时'));
      xhr.onabort = () => reject(new Error('已取消'));
      xhr.send(blob);
    });
  }

  async function uploadFile(f, ui){
    const uploadId = fileKey(f);
    const total = Math.max(1, Math.ceil(f.size / CHUNK_SIZE));

    // 1. 先问服务端已经收到哪些片了
    const have = new Set();
    try {
      const s = await api('api/chunk/status/' + uploadId);
      for (const r of (s.received || [])) have.add(typeof r === 'number' ? r : r.i);
    } catch (e) { if (e.fatal) throw e; }

    const pending = [];
    for (let i = 0; i < total; i++) if (!have.has(i)) pending.push(i);

    const prog = new Array(total).fill(0);
    for (const i of have) prog[i] = 1;
    for (const i of pending) prog[i] = 0;

    let completed = 0;
    let lastBytes = prog.reduce((a,b)=>a+b,0) * CHUNK_SIZE;
    let lastT = Date.now(), speed = 0;

    const report = () => {
      const sent = Math.min(prog.reduce((a,b)=>a+b,0) * CHUNK_SIZE, f.size);
      const now = Date.now();
      if (now - lastT >= 700){
        const inst = (sent - lastBytes) / ((now - lastT) / 1000);
        speed = speed ? speed * 0.6 + inst * 0.4 : inst;
        lastBytes = sent; lastT = now;
      }
      const pct = f.size ? sent / f.size : 1;
      ui.setBar(pct);
      ui.setStat(`${Math.round(pct*100)}% · ${human(sent)}/${human(f.size)} · ${fmtSpeed(speed)} · 剩 ${fmtEta(speed > 0 ? (f.size - sent)/speed : Infinity)}`);
    };

    if (have.size > 0) ui.setNote(`已续传 ${have.size}/${total} 片`);
    report();

    // 2. 并发上传缺失的分片，每片独立重试
    let cursor = 0;
    async function worker(){
      while (cursor < pending.length){
        const idx = pending[cursor++];
        const start = idx * CHUNK_SIZE;
        const blob = f.slice(start, Math.min(f.size, start + CHUNK_SIZE));
        const buf = await blob.arrayBuffer();
        const hash = await sha256Hex(buf);

        let lastErr = null;
        for (let t = 1; t <= MAX_TRIES; t++){
          try {
            await putChunk(uploadId, idx, blob, hash, (p) => { prog[idx] = p * 0.97; report(); });
            lastErr = null;
            break;
          } catch (e) {
            if (e.fatal) throw e;
            lastErr = e;
            if (t === MAX_TRIES) break;
            const wait = Math.min(1000 * Math.pow(1.7, t - 1), 20000) * (0.7 + Math.random() * 0.6);
            ui.setNote(`第 ${idx+1} 片失败（${e.message}），${Math.round(wait/1000)} 秒后重试 ${t}/${MAX_TRIES-1}`);
            await sleep(wait);
          }
        }
        if (lastErr) throw lastErr;
        prog[idx] = 1;
        completed++;
        if (completed % 3 === 0) ui.setNote('');
        report();
      }
    }
    await Promise.all(Array.from({ length: Math.max(1, Math.min(CONCURRENCY, pending.length || 1)) }, worker));

    // 3. 让服务端合并
    ui.setNote('分片已传完，服务器正在合并…');
    const r = await api('api/chunk/complete', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ uploadId, name: f.name, total, size: f.size })
    });
    ui.setNote('');
    return r;
  }

  const drop = $('drop'), picker = $('picker');
  drop.onclick = () => picker.click();
  picker.onchange = () => { if (picker.files.length) startUpload(picker.files); picker.value = ''; };
  ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => {
    const f = e.dataTransfer && e.dataTransfer.files;
    if (f && f.length) startUpload(f);
  });
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => e.preventDefault());

  function makeRow(name){
    const row = document.createElement('div');
    row.className = 'prow';
    row.innerHTML =
      '<div class="top"><span class="nm">' + esc(name) + '</span><span class="st">准备中</span></div>' +
      '<div class="bar"><i></i></div>' +
      '<div class="note"></div>';
    const bar = row.querySelector('.bar > i');
    const st = row.querySelector('.st');
    const note = row.querySelector('.note');
    return {
      el: row,
      setBar(p){ bar.style.width = Math.round(Math.max(0, Math.min(1, p)) * 100) + '%'; },
      setStat(t){ st.textContent = t; },
      setNote(t){ note.textContent = t || ''; },
      done(){ row.classList.add('done'); row.classList.remove('fail'); this.setBar(1); this.setNote(''); },
      fail(){ row.classList.add('fail'); }
    };
  }

  let uploading = false;
  async function startUpload(fileList){
    if (uploading) { toast('还有文件在上传中，请稍候'); return; }
    const files = Array.from(fileList);
    if (!files.length) return;
    uploading = true;
    drop.classList.add('busy');
    const box = $('progress');
    let okCount = 0;

    for (const f of files){
      const ui = makeRow(f.name);
      box.appendChild(ui.el);
      const t0 = Date.now();
      try {
        const r = await uploadFile(f, ui);
        ui.done();
        ui.setStat(`完成 · ${human(r.size)} · ${((Date.now()-t0)/1000).toFixed(1)} 秒`);
        okCount++;
      } catch (e) {
        ui.fail();
        if (e.fatal) {
          ui.setStat('已暂停');
          ui.setNote('登录已过期，重新登录后重选同一文件即可续传');
        } else {
          ui.setStat('失败');
          ui.setNote(e.message + '（已传分片会保留，重选同一文件可续传）');
          toast('「' + f.name + '」上传失败：' + e.message, 'bad');
        }
      }
    }

    uploading = false;
    drop.classList.remove('busy');
    if (okCount) { toast(`已上传 ${okCount} 个文件`, 'ok'); load(); }
  }

  /* ============ 启动 ============ */
  fetch(BASE + 'api/session', { credentials:'same-origin' })
    .then(r => r.json())
    .then(j => { if (j && j.authed) showApp(); else showLogin(); })
    .catch(() => showLogin());
})();
</script>
</body>
</html>
