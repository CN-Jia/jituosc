name: Deploy

# 触发策略：
#   - 推送 tag（v*）  → 测试门禁 → 构建镜像 → 推 GHCR → SSH 部署到生产服务器
#   - 手动触发        → 同上（用于回滚或重新部署；在 Actions 页面选择分支/tag）
#
# 日常提交到 master 只跑 ci.yml，不会动生产环境。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:   # 手动触发

# 同一时间只允许一次生产部署：避免两次发布并发覆盖，
# cancel-in-progress=false 保证进行中的部署不会被新触发的任务打断。
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/cn-jia/jituo-backend
  IMAGE_NGINX: ghcr.io/cn-jia/jituo-nginx

jobs:
  # ── 部署门禁：测试不通过就不发布 ────────────────────────────
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jituo
          POSTGRES_PASSWORD: jituo_test
          POSTGRES_DB: jituo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: backend
        run: pnpm db:generate

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://jituo:jituo_test@localhost:5432/jituo_test
          JWT_SECRET: ci-test-jwt-secret-at-least-16-chars
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD_HASH: $2b$10$ci-test-placeholder-hash
        run: pnpm test

  # ── 构建镜像并部署 ──────────────────────────────────────────
  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # 推镜像到 GHCR 需要 packages: write；其余只读即可
    permissions:
      contents: read
      packages: write

    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Show deploy target
        run: |
          echo "ref      : ${{ github.ref_name }}"
          echo "ref type : ${{ github.ref_type }}"
          echo "commit   : ${{ github.sha }}"

      # ── 登录 GHCR ──────────────────────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 构建 + 推送 Backend 镜像 ────────────────────────────
      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
            ${{ env.IMAGE_BACKEND }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 构建 + 推送 Nginx 镜像 ──────────────────────────────
      - name: Build & push nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.nginx
          push: true
          tags: |
            ${{ env.IMAGE_NGINX }}:latest
            ${{ env.IMAGE_NGINX }}:${{ github.sha }}
            ${{ env.IMAGE_NGINX }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 部署到生产服务器 ─────────────────────────────────────
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo ">>> Pull latest images..."
            cd /var/www/jituo
            docker compose -f docker-compose.prod.yml pull

            echo ">>> Redeploy containers..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo ">>> Run database migration..."
            docker compose -f docker-compose.prod.yml exec -T backend \
              npx prisma migrate deploy

            echo ">>> Prune old images..."
            docker image prune -af

            echo ">>> Health check..."
            sleep 3
            curl -f http://localhost:80/health || { echo "Health check failed"; exit 1; }

            echo ">>> Deploy completed successfully!"
